[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-qwen-tts"
version = "0.1.0"
description = "Private local speech synthesis provider and bounded Python client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
kilix-qwen-tts = "kilix_qwen_tts.cli:main"

[dependency-groups]
cpu = ["qwen-tts==0.1.1", "torch==2.6.0+cpu", "torchaudio==2.6.0+cpu"]
build = ["setuptools==78.1.0", "wheel==0.45.1"]
dev = ["ruff==0.12.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kilix_qwen_tts = ["*.json"]

[tool.uv]
required-version = "==0.12.5"
default-groups = []
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The provider invokes only the pinned engine API. Its demonstration web UI
# is not a runtime entrypoint; no gradio server or its dependencies are staged.
exclude-dependencies = [
  { package = { name = "qwen-tts", version = "0.1.1" }, dependencies = ["gradio"] },
]
constraint-dependencies = [
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.3",
  "PyYAML==6.0.3",
  "accelerate==1.12.0",
  "audioread==3.1.0",
  "certifi==2026.7.22",
  "cffi==2.1.1",
  "charset-normalizer==3.5.1",
  "cloudpickle==3.1.2",
  "coloredlogs==15.0.1",
  "decorator==5.3.1",
  "einops==0.8.1",
  "filelock==3.32.3",
  "flatbuffers==25.12.19",
  "fsspec==2026.7.0",
  "hf-xet==1.6.0",
  "huggingface_hub==0.36.2",
  "humanfriendly==10.0",
  "idna==3.19",
  "joblib==1.6.0",
  "lazy-loader==0.5",
  "librosa==0.11.0",
  "llvmlite==0.49.0",
  "mpmath==1.3.0",
  "msgpack==1.2.2",
  "narwhals==2.25.0",
  "networkx==3.6.1",
  "numba==0.67.0",
  "numpy==2.5.3",
  "onnxruntime==1.22.1",
  "packaging==26.3",
  "platformdirs==4.11.7",
  "pooch==1.9.0",
  "protobuf==7.36.1",
  "psutil==7.2.2",
  "pycparser==3.0",
  "regex==2026.9.3",
  "requests==2.34.2",
  "safetensors==0.8.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "setuptools==78.1.0",
  "soundfile==0.13.1",
  "sox==1.5.0",
  "soxr==1.1.0",
  "sympy==1.13.1",
  "threadpoolctl==3.6.0",
  "tokenizers==0.22.2",
  "torch==2.6.0+cpu",
  "torchaudio==2.6.0+cpu",
  "tqdm==4.70.0",
  "transformers==4.57.3",
  "typing_extensions==4.16.0",
  "urllib3==2.7.0",
]

[tool.uv.sources]
qwen-tts = { git = "https://github.com/QwenLM/Qwen3-TTS.git", rev = "6cafe5582caea83df269c36b1ce62d953a9cc66b" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
